auth:
  provider_missing: Sign-in service is not enabled
  invalid_credentials: Incorrect username or password
  captcha_invalid: Incorrect or expired verification code
  login_denied: Sign-in is not allowed
  challenge_invalid: Verification expired. Please sign in again
  verify_failed: Verification failed. Please try again
  provider:
    wecom: WeCom
    dingtalk: DingTalk
    feishu: Feishu
    google: Google
    github: GitHub
    oidc: OIDC
setup:
  local_only: Open http://localhost:%d on the server itself to finish setup. Behind a reverse proxy or from another machine, set setup.allow_remote=true and send the setup token (printed in the console) in the X-Setup-Token header
  token_invalid: Invalid setup token
  running: Setup is already running
  invalid_input: Invalid setup parameters
tenant:
  expired: This tenant has expired. Please contact the platform administrator to renew.
  suspended: This tenant has been suspended. Please contact the platform administrator.
  quota_users: The user limit of your plan (%d) has been reached
  quota_roles: The role limit of your plan (%d) has been reached
  quota_storage: The storage limit of your plan (%d MB) has been reached
  domain_invalid: Invalid domain name
  domain_reserved: This domain is reserved and cannot be bound
  domain_taken: This domain is already bound to another tenant
  admin_invalid: Invalid tenant administrator username, password or email
notice:
