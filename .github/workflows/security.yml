name: security

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GOTOOLCHAIN: local
  GOFLAGS: -mod=readonly

jobs:
  license-changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      licenses: ${{ steps.select.outputs.licenses }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: select
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          args=()
          if [ -n "$PR_BASE" ]; then args=(--base "$PR_BASE"); fi
          python3 scripts/ci/changed_packages.py "${args[@]}" --licenses-only --output "$GITHUB_OUTPUT"

  secrets:
    name: Worktree secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: 1.25.0
          cache: false
      - name: Install open source gitleaks CLI (no commercial token)
        run: go install github.com/zricethezav/gitleaks/v8@v8.28.0
      - name: Test security gates
        run: python3 -m unittest discover -s scripts/security -p 'test_*.py' -v
      - name: Scan checked out files, without Git history or inline bypasses
        run: gitleaks dir . --config .gitleaks.toml --redact --ignore-gitleaks-allow --gitleaks-ignore-path /dev/null --exit-code 1

  go-vulnerabilities:
    name: Go vulnerabilities
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: 1.25.0
      - run: go mod download
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
      - run: govulncheck -test ./...

  go-licenses:
    needs: license-changes
    if: needs.license-changes.outputs.licenses == 'true'
    name: Go license allowlist
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: 1.25.0
      - run: go mod download
      - run: go install github.com/google/go-licenses/v2@v2.0.1
      - run: python3 scripts/security/licenses.py go

  npm-vulnerabilities:
    name: npm vulnerabilities
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.14.0
      - run: npm install --global npm@10.9.2 --ignore-scripts --no-audit --no-fund
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm audit --audit-level=low --include=dev --include=optional --registry=https://registry.npmjs.org

  npm-licenses:
    needs: license-changes
    if: needs.license-changes.outputs.licenses == 'true'
    name: npm license allowlist
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.14.0
      - run: npm install --global npm@10.9.2 --ignore-scripts --no-audit --no-fund
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: web
      - run: python3 scripts/security/licenses.py npm
