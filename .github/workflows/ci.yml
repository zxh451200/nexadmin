# 通用 CI：后端 build/vet/test + 前端 tsc/eslint。release check 与派生验证不在这里（见 derive.yml）。
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      backend: ${{ steps.select.outputs.backend }}
      frontend: ${{ steps.select.outputs.frontend }}
      packages: ${{ steps.select.outputs.packages }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: go.mod
      - id: select
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          args=()
          if [ -n "$PR_BASE" ]; then args=(--base "$PR_BASE"); fi
          python3 scripts/ci/changed_packages.py "${args[@]}" --output "$GITHUB_OUTPUT"
      - run: python3 -m unittest discover -s scripts/ci -p 'test_*.py'
      - if: github.event_name == 'pull_request'
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/ci/contract_version.py --base "$PR_BASE"

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - name: Build, vet and test selected packages
        env:
          SELECTED_PACKAGES: ${{ needs.changes.outputs.packages }}
        run: |
          python3 - <<'PYTHON'
          import json, os, subprocess
          packages = json.loads(os.environ['SELECTED_PACKAGES'])
          for command in (['go', 'build'], ['go', 'vet'], ['go', 'test', '-timeout=90s']):
              subprocess.run(command + packages, check=True)
          PYTHON
      - run: go test ./core ./core/response -run '^TestContract' -count=1 -timeout=90s

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.14.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
