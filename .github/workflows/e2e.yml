# UI 几何回归闸（web/playwright.config.ts + web/e2e/*.spec.ts）：
# 落位线/缩进/滑块坐标这类断言是物理像素算出来的，改错不报错只画歪，tsc/eslint 照不出来。
# 与 ci.yml 的 frontend job 分开：那个 3 分钟纯静态检查，这个要下浏览器 + 起 vite dev，慢一个量级。
name: e2e

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/e2e.yml'
  pull_request:
    paths:
      - 'web/**'
      - '.github/workflows/e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.14.0
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      # 只装 config 里 projects 用到的那一个引擎（chromium）；--with-deps 补 apt 侧的系统库。
      # playwright@1.64 的 npm 包没有 install/postinstall 脚本，npm ci 不会自动下浏览器，这步不能省。
      - run: npx playwright install chromium --with-deps

      # 不要在这里再起 vite：playwright.config.ts 的 webServer 会自己起（npx vite --port 5199 --strictPort）。
      # 不要把 --output 指回仓库里（默认就是 web/test-results）：vite 会 watch 项目内的
      # test-results/ 与 playwright-report/，产物落盘触发重编译 → 跑中途整页 reload → 几何断言拿到半个 DOM，
      # 是一条「时红时绿、查不出代码问题」的假红。产物一律写到仓库外的 RUNNER_TEMP。
      - name: Run geometry gate
        run: npm run e2e -- --reporter=list --output="$RUNNER_TEMP/pw-artifacts"

      - name: Upload artifacts (only on failure)
        if: failure()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: playwright-geometry-artifacts
          path: ${{ runner.temp }}/pw-artifacts/
          if-no-files-found: ignore
          retention-days: 7
