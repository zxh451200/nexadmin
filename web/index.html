<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1020" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="NexAdmin" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>NexAdmin</title>
    <script>
      // 首屏渲染前设好主题与语言方向，避免刷新闪白（light | dark | system）
      (function () {
        try {
          var mode = localStorage.getItem('nex-theme') || 'system'
          var dark = mode === 'dark' || (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          var root = document.documentElement
          if (dark) root.classList.add('dark')
          var lang = localStorage.getItem('nex-lang')
          if (lang) {
            root.lang = lang
            root.dir = /^(ar|he|fa|ur)/.test(lang) ? 'rtl' : 'ltr'
          }
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', dark ? '#0b1020' : '#f4f7fb')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
