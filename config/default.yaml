# 框架默认值（框架区，随升级覆盖）。用户只在 config/config.yaml 里写要改的项。
app:
  env: dev            # dev | production
  name: NexAdmin
  timezone: UTC
  auto_migrate: true  # 启动时自动执行待迁移 SQL；生产可设 false（有待执行迁移则拒绝启动，需先运行 nexadmin-server migrate）
server:
  port: 8080
  cors_origins: []    # 允许跨域的 Origin 白名单（精确匹配，如 https://admin.example.com）；空 = 同源；dev 环境自动放行开发服务器
  # 可信反向代理（IP 或 CIDR 列表）。默认空 = 不信任任何代理：真实客户端 IP 只取 TCP 对端地址，伪造的 X-Forwarded-For / X-Real-IP 无效。
  # 反向代理（nginx / 负载均衡）部署必须配置，例如 ["127.0.0.1", "10.0.0.0/8"]；否则所有按 IP 的限流、登录日志、
  # 开放平台 IP 白名单看到的都是代理地址，同一出口 IP 的所有用户共用一份限流额度。
  # 只有对端地址在此列表内才会采信转发头，并取其中最右一个不在列表内的地址；代理必须覆盖/追加而不是透传客户端自带的转发头。
  # /metrics、关停接口、初始化向导的“本机”判定不受此项影响，永远只看对端地址。
  trusted_proxies: []
database:
  type: mysql         # mysql | mariadb | postgres
  host: 127.0.0.1
  port: 3306
  user: root
  password: ""
  name: nexadmin
  node_id: 0          # 雪花 ID 节点号 0-1023，多实例必须各不相同；配 -1 = 共享缓存下自动抢空闲号（0-1023）
  # 可选 database.isolation（字段及连接示例见 docs/配置参考.md）；不配置即关闭，不自动拆分存量数据。
  # isolation.enabled 默认 false；isolation.auto_migrate 默认 false。
  # 已初始化服务启动时，租户库自动迁移须 app.auto_migrate 与 isolation.auto_migrate 同时为 true；
  # 否则仅检查租户库迁移，有待执行项则拒绝启动，先用 nexadmin-server migrate --tenant <ID> 处理。
  # 初始化入口的平台迁移显式执行，租户迁移单独由 isolation.auto_migrate 控制。
  # 独立库模式 restore/reinit 必须显式 --platform-only；全库备份恢复使用 backup / restore-bundle。
cache:
  driver: memory      # memory | redis（Valkey 兼容）
  addr: ""
  password: ""
languages:                # 平台语言清单的种子：首次启动写入 sys_language，之后以表为准（后台「系统设置 → 语言管理」可改）
  # 日期格式必须加引号，否则 YAML 会把 2006-01-02 解析成日期对象而不是 Go 布局串。
  - { code: zh-CN, name: 简体中文, dir: ltr, short: 中, htmlLang: zh-CN, ogLocale: zh_CN, prefix: "", dateFormat: "2006-01-02", default: true }
  - { code: en-US, name: English, dir: ltr, short: EN, htmlLang: en, ogLocale: en_US, prefix: en, dateFormat: "Jan 2, 2006" }
auth:
  methods: [password]       # password | phone；phone 还需要配置下面的 sms.provider，否则自动隐藏
  single_session: false     # true = 同一用户只保留最后一次登录，旧 access/refresh token 会立即失效
  allow_register: false     # 自助注册的兜底值：运行时真源是后台「参数设置」的 user.register_enabled（默认关闭，改完即时生效），仅该参数行缺失时读本项。强制图形验证码 + IP 限流；注册用户进当前租户并受套餐用户数上限约束
  register_roles: []        # 注册用户默认挂的角色码（当前租户内解析，如 [guest]）；空 = 不挂角色，注册后待管理员分配权限
  # 第三方快捷登录（OAuth2 授权码流程）。没配置的不显示；缺 client_id / client_secret / redirect_uris 视为未配置。
  # 在 config/config.yaml 里按需取消注释。密钥务必用 ${ENV} 引用环境变量，不要明文写进仓库。
  # 通用字段（每个 provider 都支持）：
  #   client_id / client_secret   应用凭据，如 client_secret: ${GOOGLE_CLIENT_SECRET}
  #   redirect_uris               回调地址白名单（精确匹配）= 前端回调页 /admin/login/oauth/<provider> 的完整 URL
  #   match_by                    首次登录自动匹配已有账号的依据：phone | email | employee_no（空 = 不自动匹配）
  #                               email 只认“已验证”邮箱；employee_no 对应本地用户名；匹配不上提示“绑定已有账号”
  #   auto_create                 匹配不上时自动建号（无密码），默认 false
  #   default_role                auto_create 赋予的角色编码，默认 guest；内置角色不会被自动赋予
  #   allowed_email_domains       只允许这些邮箱域名登录（要求邮箱已验证），默认不限制，如 [corp.com]
  providers: {}
  #   wecom:                      # 企业微信扫码：client_id=CorpID，client_secret=应用 Secret
  #     client_id: ${WECOM_CORP_ID}
  #     client_secret: ${WECOM_SECRET}
  #     agent_id: "1000002"
  #     redirect_uris: [https://admin.example.com/admin/login/oauth/wecom]
  #     match_by: phone
  #   dingtalk:                   # 钉钉：client_id=AppKey，client_secret=AppSecret
  #     client_id: ${DINGTALK_APP_KEY}
  #     client_secret: ${DINGTALK_APP_SECRET}
  #     redirect_uris: [https://admin.example.com/admin/login/oauth/dingtalk]
  #     match_by: phone
  #   feishu:                     # 飞书：client_id=App ID，client_secret=App Secret
  #     client_id: ${FEISHU_APP_ID}
  #     client_secret: ${FEISHU_APP_SECRET}
  #     redirect_uris: [https://admin.example.com/admin/login/oauth/feishu]
  #     match_by: employee_no
  #   google:                     # Google（标准 OIDC，授权码 + PKCE）；需要服务器能访问 accounts.google.com，受限网络请配 auth.proxy
  #     client_id: ${GOOGLE_CLIENT_ID}
  #     client_secret: ${GOOGLE_CLIENT_SECRET}
  #     redirect_uris: [https://admin.example.com/admin/login/oauth/google]
  #     match_by: email
  #     allowed_email_domains: [corp.com]
  #   github:                     # GitHub（OAuth2），只取已验证的主邮箱；需要服务器能访问 github.com
  #     client_id: ${GITHUB_CLIENT_ID}
  #     client_secret: ${GITHUB_CLIENT_SECRET}
  #     redirect_uris: [https://admin.example.com/admin/login/oauth/github]
  #     match_by: email
  #   oidc:                       # 通用 OIDC（Keycloak、Casdoor 等），issuer 需提供 /.well-known/openid-configuration
  #     name: Keycloak            # 登录页展示名
  #     issuer: https://sso.example.com/realms/main
  #     client_id: nexadmin
  #     client_secret: ${OIDC_CLIENT_SECRET}
  #     scopes: [openid, email, profile]
  #     redirect_uris: [https://admin.example.com/admin/login/oauth/oidc]
  #     match_by: email
  proxy: ""                 # 访问 Google / GitHub 等外网用的 HTTP(S) 代理，如 http://127.0.0.1:7890；空 = 直连
  jwt_secret: ""            # 空 = 首次启动自动生成并保存到 data/jwt.secret
  access_ttl: 30m
  refresh_ttl: 168h
sms:                        # 短信通道（手机号登录、绑定手机号）。provider 为空时 auth.methods 自动不含 phone
  provider: ""              # 空 = 不启用 | log = 验证码打印到日志，仅开发用（生产启用会在启动时警告）| webhook | aliyun | tencent
  template: login           # 验证码模板标识：阿里云 TemplateCode（变量 ${code}）/ 腾讯云已审核的数字模板 ID / webhook 的 template 字段
  webhook:                  # provider: webhook —— POST JSON 到你的网关，带 X-Timestamp / X-Nonce / X-Signature(HMAC-SHA256)
    url: ""                 # 网关地址，如 https://sms-gw.internal/send
    secret: ""              # 签名密钥，建议 ${SMS_WEBHOOK_SECRET}；签名 = HMAC-SHA256(secret, timestamp + "." + nonce + "." + body)
  aliyun:                   # provider: aliyun —— 短信服务 Dysmsapi（RPC 签名 v1）；请使用只有短信权限的 RAM 子账号
    access_key_id: ""       # ${ALIYUN_SMS_KEY_ID}
    access_key_secret: ""   # ${ALIYUN_SMS_KEY_SECRET}
    sign_name: ""           # 已审核的短信签名
    endpoint: ""            # 空 = https://dysmsapi.aliyuncs.com
  tencent:                  # provider: tencent —— SendSms 2021-01-11，标准库 TC3-HMAC-SHA256
    secret_id: ""           # ${TENCENT_SMS_SECRET_ID}；建议使用只有短信权限的子账号
    secret_key: ""          # ${TENCENT_SMS_SECRET_KEY}
    sdk_app_id: ""          # 短信应用 SDKAppID
    sign_name: ""           # 已审核的短信签名
    region: ""              # 空 = ap-guangzhou
    endpoint: ""            # 空 = https://sms.tencentcloudapi.com；只接受无路径的 http(s) 地址
    notify_template: ""     # 通知专用的已审核数字模板 ID；空则跳过腾讯云通知短信
    param_order: {}         # 模板 ID -> 参数名数组，如 {"123456": [code], "234567": [title, content]}；未配置时按参数名排序
upload:
  max_size_image_mb: 0      # 0 或留空 = 不限制
  max_size_video_mb: 0
  max_size_file_mb: 0
storage:
  driver: local             # local = data/uploads | s3 = S3 兼容（MinIO / 阿里云 OSS / 腾讯 COS / 七牛）
  s3:                       # 字符串支持 ${ENV}，如 secret_key: ${S3_SECRET_KEY}；密钥不要写进仓库
    endpoint: ""            # https://s3.amazonaws.com、http://minio:9000、https://oss-cn-hangzhou.aliyuncs.com
    region: ""              # 空 = us-east-1
    bucket: ""
    access_key: ""
    secret_key: ""
    prefix: ""              # 可选键前缀，如 nexadmin
    path_style: false       # true: endpoint/bucket/key（MinIO）；false: bucket.endpoint/key（OSS / COS / AWS）
    insecure_skip_verify: false   # 不校验 TLS 证书，仅内网自签名时使用
    presign_redirect: false # false = 私有文件由后端代理（不暴露 bucket）；true = 302 到预签名 URL
    part_size_mb: 8         # 分片大小，最小 5
    multipart_threshold_mb: 16    # 超过则走分片上传
message:
  retention_days: 90
job:                        # 异步任务运行器（导出中心等）
  workers: 2                # 并发 worker 数
  keep_days: 7              # 任务记录与结果文件保留天数，到期连文件一并清理
  max_per_user: 3           # 每个用户同时进行中（排队 + 执行）的任务上限，防刷
export:
  sync_limit: 5000          # 匹配行数不超过它时同步直出；超过则前端改用异步导出
log:
  export_max_rows: 50000    # 操作日志 / 登录日志服务端导出（GET /oper-logs/export、/login-logs/export）的行数上限，超过则拒绝，需缩小筛选范围
setup:
  allow_remote: false
ai:
  base_url: ""
  api_key: ""
  model: ""
  allow_private_base_url: false  # true 才允许 base_url 指向私网 / 回环（Ollama、vLLM、内网网关）；链路本地与云元数据地址永远拒绝
disabled_modules: []
disabled_plugins: []        # 按插件 id 停用插件（如 [website]）：不挂载、不迁移、接口文档不出现；free 插件的软停用开关，pro 插件也可用
backup:                     # 数据库备份（需要本机有 mysqldump / pg_dump）；恢复用命令行 nexadmin-server restore
  dir: ./backup             # 备份目录（权限 0700，文件 0600）
  keep_days: 30             # 保留天数，0 = 不按天清理（以下三项首次启动作为初始值，之后以页面设置为准）
  keep_count: 10            # 保留份数，0 = 不按份数清理
  schedule: ""              # 每天固定时刻 "HH:MM"，空 = 关闭定时备份
ratelimit:                  # 固定窗口限流；计数放 cache（redis 多实例共享，memory 仅本进程）；缓存故障时放行并告警
  enabled: true             # 总开关
  login:    { limit: 20,  window: 1m }   # 按 IP+路径；登录
  refresh:  { limit: 30,  window: 1m }   # 按 IP+路径；刷新令牌
  password_change: { limit: 10, window: 1m } # 按 IP+路径；修改密码
  captcha:  { limit: 30,  window: 1m }   # 按 IP+路径；图形验证码
  sms_code: { limit: 5,   window: 1m }   # 按 IP+路径；短信验证码
  token:    { limit: 10,  window: 1m }   # /oauth/token 失败次数（同 IP 或 IP+client），超限 429
  setup:    { limit: 30,  window: 1m }   # 按 IP；初始化向导
  upload:   { limit: 120, window: 1m }   # 按用户；文件上传
  ai:       { limit: 30,  window: 1m }   # 按用户；AI 接口
  pat_create:   { limit: 10, window: 1h }  # 按用户；创建个人访问令牌
  openapi_sign: { limit: 30, window: 1m }  # 按 IP；令牌/签名校验失败次数，超限 429
  client_error: { limit: 30, window: 1m }  # 按 IP；前端错误上报 POST /api/v1/client-errors，超限 429
  dashboard_layout: { limit: 30, window: 1m }  # 按用户；工作台布局 /api/v1/dashboard/layout，超限 429
  log_export:   { limit: 10, window: 1m }  # 按用户；操作日志 / 登录日志导出，超限 429
  mcp:          { limit: 120, window: 1m } # 按用户；POST /api/v1/mcp，超限 429
  mcp_confirm:  { limit: 5,   window: 10m } # 按用户+确认 ID；MCP 写确认密码失败次数，超限作废该确认
metrics:                    # Prometheus 文本格式指标，挂在根路径 /metrics（不在 /api/v1 下）
  enabled: true             # 默认开启，但 token 为空时只允许回环地址（127.0.0.1 / ::1）访问
  token: ""                 # 非空 = 必须带 Authorization: Bearer <token>（任何来源地址都要），常量时间比较
secret:                     # 静态加密（core/secret）：业务敏感字段落库加密的主密钥来自 NEXADMIN_SECRET_KEY 或 data/secret.key
  algorithm: aes-gcm        # aes-gcm（默认，enc:v1:）| sm4-gcm（国密 SM4-GCM，enc:v2:；切换后旧 v1 密文仍可解，新写入用 v2）
