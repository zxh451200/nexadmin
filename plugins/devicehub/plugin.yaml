id: devicehub
name: 设备接入与监控
version: 0.1.0
description: 工业设备接入与监控：Modbus TCP / MQTT 驱动接入变频器、PLC 与上位机网关，测点配置与秒级采集（死区压缩、断线重连）、实时监控页（WS 推送）、指令下发（独立权限 + 回执 + 操作日志）、阈值告警（站内信通知）、历史数据与 xlsx 报表导出；devicehub.* 事件可由宿主订阅。协议驱动为插件内可注册接口，二期扩展 S7 / OPC UA。
author: NexAdmin
edition: pro
requires_nexadmin: ">=0.1.0"

# 安装时写入 sys_menu（字段与内置菜单一致；parent 写父节点 code）。
# title 是 i18n key，文案在 web/src/plugins/devicehub/locales 的 plugin_devicehub 命名空间里。
# edit / control 是按钮级权限点：设备写操作（下发指令）与配置改动分开授权，不挂根级。
menus:
  - parent: /
    type: menu
    title: plugin_devicehub.menu
    path: /devicehub/monitor
    component: plugins/devicehub/DevicePage
    perm: devicehub:list
    icon: Gauge
    sort: 64
    keep_alive: true
  - parent: devicehub:list
    type: button
    title: plugin_devicehub.perm.edit
    perm: devicehub:edit
  - parent: devicehub:list
    type: button
    title: plugin_devicehub.perm.control
    perm: devicehub:control
