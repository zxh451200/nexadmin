id: ticket
name: 工单中心
version: 0.1.0
description: 工单生命周期（open → processing ⇄ pending → resolved → closed，报告人回复自动重开）、优先级、标签、分组队列与自动分派、自动化规则、认领改派、内部备注与附件、快捷回复、动态轨迹、SLA 停表与首响/解决双时限、满意度、按筛选导出 xlsx；ticket.* 事件，访客公开 API 可由宿主前台接入。
author: NexAdmin
edition: pro
requires_nexadmin: ">=0.1.0"
menus:
  - parent: /
    type: menu
    title: plugin_ticket.menu
    path: /ticket/tickets
    component: plugins/ticket/TicketPage
    perm: ticket:list
    icon: Inbox
    sort: 62
    keep_alive: true
  - parent: ticket:list
    type: button
    title: plugin_ticket.perm.reply
    perm: ticket:reply
  - parent: ticket:list
    type: button
    title: plugin_ticket.perm.edit
    perm: ticket:edit
  - parent: ticket:list
    type: button
    title: plugin_ticket.perm.create
    perm: ticket:create
