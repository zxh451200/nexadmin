id: ticket
name: 工单中心
version: 0.1.0
description: 工单生命周期（open → processing → resolved → closed，报告人回复自动重开）、优先级、认领改派、ticket.* 事件；访客公开 API 可由宿主前台接入。
author: NexAdmin
edition: pro
requires_nexadmin: ">=0.1.0"
menus:
  - parent: /
    type: menu
    title: plugin_ticket.menu
    path: /ticket/tickets
    component: plugins/ticket/TicketPage
    perm: ticket:list
    icon: Inbox
    sort: 62
    keep_alive: true
  - parent: ticket:list
    type: button
    title: plugin_ticket.perm.reply
    perm: ticket:reply
  - parent: ticket:list
    type: button
    title: plugin_ticket.perm.edit
    perm: ticket:edit
