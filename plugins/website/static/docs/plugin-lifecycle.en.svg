<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="Plugin lifecycle: free plugins work right after start, pro plugins need a licence, and plugins touching the root router need a restart">
  <defs>
    <marker id="pl-arrow-en" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#737a86"/>
    </marker>
  </defs>

  <text x="20" y="28" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" letter-spacing="1.4" fill="#737a86">PLUGIN LIFECYCLE · FREE VS PRO</text>
  <text x="880" y="28" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" letter-spacing="1" fill="#737a86">install once, rebuild after</text>

  <rect x="20" y="58" width="170" height="86" rx="10" fill="#737a86" fill-opacity="0.06" stroke="#737a86" stroke-opacity="0.45"/>
  <text x="38" y="82" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing="1.2" fill="#5e6ad2">01</text>
  <text x="38" y="114" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="21" font-weight="600" fill="#828896">Install</text>
  <text x="38" y="138" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#737a86">plugin install</text>

  <rect x="224" y="58" width="170" height="86" rx="10" fill="#737a86" fill-opacity="0.06" stroke="#737a86" stroke-opacity="0.45"/>
  <text x="242" y="82" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing="1.2" fill="#5e6ad2">02</text>
  <text x="242" y="114" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="21" font-weight="600" fill="#828896">Rebuild</text>
  <text x="242" y="138" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#737a86">build.sh</text>

  <rect x="428" y="58" width="140" height="86" rx="10" fill="#737a86" fill-opacity="0.06" stroke="#737a86" stroke-opacity="0.45"/>
  <text x="446" y="82" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing="1.2" fill="#5e6ad2">03</text>
  <text x="446" y="114" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="21" font-weight="600" fill="#828896">Start</text>
  <text x="446" y="138" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#737a86">server start</text>

  <line x1="190" y1="101" x2="216" y2="101" stroke="#737a86" stroke-opacity="0.7" stroke-width="1.4" marker-end="url(#pl-arrow-en)"/>
  <line x1="394" y1="101" x2="420" y2="101" stroke="#737a86" stroke-opacity="0.7" stroke-width="1.4" marker-end="url(#pl-arrow-en)"/>
  <line x1="568" y1="101" x2="592" y2="101" stroke="#737a86" stroke-opacity="0.7" stroke-width="1.4"/>
  <line x1="596" y1="70" x2="596" y2="196" stroke="#737a86" stroke-opacity="0.55" stroke-width="1.4"/>
  <line x1="596" y1="70" x2="612" y2="70" stroke="#737a86" stroke-opacity="0.7" stroke-width="1.4" marker-end="url(#pl-arrow-en)"/>
  <line x1="596" y1="196" x2="612" y2="196" stroke="#737a86" stroke-opacity="0.7" stroke-width="1.4" marker-end="url(#pl-arrow-en)"/>

  <rect x="620" y="38" width="260" height="64" rx="10" fill="#5e6ad2" fill-opacity="0.10" stroke="#5e6ad2" stroke-opacity="0.55"/>
  <text x="638" y="66" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="19" font-weight="600" fill="#828896">Free · active on start</text>
  <text x="638" y="86" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#737a86">no .lic needed</text>

  <rect x="620" y="164" width="130" height="64" rx="10" fill="#737a86" fill-opacity="0.06" stroke="#737a86" stroke-opacity="0.45"/>
  <text x="636" y="192" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="18" font-weight="600" fill="#828896">Import .lic</text>
  <text x="636" y="212" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#737a86">paste licence</text>

  <rect x="772" y="164" width="108" height="64" rx="10" fill="#737a86" fill-opacity="0.06" stroke="#737a86" stroke-opacity="0.45"/>
  <text x="788" y="192" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="18" font-weight="600" fill="#828896">Restart</text>
  <text x="788" y="212" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#737a86">if requested</text>

  <line x1="750" y1="196" x2="764" y2="196" stroke="#737a86" stroke-opacity="0.7" stroke-width="1.4" marker-end="url(#pl-arrow-en)"/>

  <text x="620" y="152" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing="1" fill="#737a86">PRO PLUGIN</text>

  <line x1="20" y1="252" x2="880" y2="252" stroke="#737a86" stroke-opacity="0.22"/>
  <text x="20" y="280" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif" font-size="16" fill="#737a86">A licence only activates a plugin already in the binary: domain, expiry and requires_nexadmin must all match.</text>
</svg>
