id: website
name: 企业官网
version: 0.6.0
description: 可售卖的企业官网：匿名公开官网（服务端渲染、SEO 友好，未登录即可访问）+ 后台内容管理（站点设置、导航、特性、页面、新闻）+ 官网插件市场（浏览、搜索、下载、后台一键安装入口）。默认内容即 NexAdmin 官网。
author: NexAdmin
edition: pro
requires_nexadmin: ">=0.1.0"
migration_target: platform
menus:
  - parent: /
    type: dir
    title: plugin_website.dir
    path: /website
    icon: Globe
    sort: 65
  - parent: /website
    type: menu
    title: plugin_website.menu.settings
    path: /website/settings
    component: plugins/website/SettingsPage
    perm: website:setting
    icon: Settings
    sort: 1
    keep_alive: true
  - parent: /website
    type: menu
    title: plugin_website.menu.nav
    path: /website/nav
    component: plugins/website/NavPage
    perm: website:nav
    icon: Link2
    sort: 2
    keep_alive: true
  - parent: /website
    type: menu
    title: plugin_website.menu.features
    path: /website/features
    component: plugins/website/FeaturePage
    perm: website:feature
    icon: LayoutGrid
    sort: 3
    keep_alive: true
  - parent: /website
    type: menu
    title: plugin_website.menu.pages
    path: /website/pages
    component: plugins/website/PagePage
    perm: website:page
    icon: FileText
    sort: 4
    keep_alive: true
  - parent: /website
    type: menu
    title: plugin_website.menu.posts
    path: /website/news
    component: plugins/website/PostPage
    perm: website:post
    icon: Newspaper
    sort: 5
    keep_alive: true
  - parent: /website
    type: menu
    title: plugin_website.menu.messages
    path: /website/messages
    component: plugins/website/MessagePage
    perm: website:message
    icon: Inbox
    sort: 6
    keep_alive: true
