id: pay
name: 支付中台
version: 0.1.0
description: 资金事实中台（02-openapi-pay-v1.yaml）：支付单状态机、渠道抽象与回调验签、退款（含 refunding 与异步回执）、预授权、对账、结算打款、plg_pay_outbox 资金事件出站箱、请求级 Idempotency-Key；业务系统通过进程内 API 对接，P0 内置 mock 渠道。
author: NexAdmin
edition: pro
requires_nexadmin: ">=0.1.0"
migration_target: tenant
menus:
  - parent: /
    type: menu
    title: plugin_pay.menu
    path: /pay/orders
    component: plugins/pay/PayPage
    perm: pay:list
    icon: CreditCard
    sort: 60
    keep_alive: true
  - parent: pay:list
    type: button
    title: plugin_pay.perm.edit
    perm: pay:edit
  - parent: pay:list
    type: button
    title: plugin_pay.perm.channel
    perm: pay:channel
  - parent: pay:list
    type: button
    title: plugin_pay.perm.refund
    perm: pay:refund
  - parent: pay:list
    type: button
    title: plugin_pay.perm.auth
    perm: pay:auth
  - parent: pay:list
    type: button
    title: plugin_pay.perm.settle
    perm: pay:settle
