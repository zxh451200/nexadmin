id: ldap
name: LDAP/AD 登录
version: 0.1.0
description: 免费基础 LDAP/AD 登录适配：本地密码失败后尝试 LDAP 校验，支持 LDAPS/StartTLS、服务账号、自定义过滤器与属性映射；身份映射/自动建号由框架用户模块完成，需按需安装。
author: NexAdmin
edition: free
requires_nexadmin: ">=0.1.0"
menus:
  # 已并进「系统设置 → 安全与登录 → LDAP 配置」：只隐藏菜单行，侧栏不单列。
  # 不挂到 settings:list 下——角色分配会自动带上祖先节点，等于顺手授予 settings:list。
  - parent: /
    type: menu
    title: plugin_ldap.menu
    path: /ldap/config
    component: plugins/ldap/LdapPage
    perm: ldap:list
    icon: Server
    sort: 65
    keep_alive: true
    hidden: true
  - parent: ldap:list
    type: button
    title: plugin_ldap.perm.edit
    perm: ldap:edit
