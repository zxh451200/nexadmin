id: imports
name: 导入中心
version: 0.1.0
description: 通用 CSV 导入:模板下载、表头映射、必填校验、逐行隔离、错误行报告、导入台账;业务模块用 RegisterSource 注册可导入的表。
author: NexAdmin
edition: pro
requires_nexadmin: ">=0.1.0"
menus:
  - parent: /
    type: menu
    title: plugin_imports.menu
    path: /imports/jobs
    component: plugins/imports/ImportsPage
    perm: imports:list
    icon: FileUp
    sort: 64
    keep_alive: true
  - parent: imports:list
    type: button
    title: plugin_imports.perm.run
    perm: imports:run
