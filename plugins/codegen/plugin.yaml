id: codegen
name: 代码生成器
version: 1.3.0
description: 免费代码生成器：读取已有业务表，或在向导里定义新表；按推荐配置生成 Go 模块、前端页面与三引擎迁移，字段可配查询方式（包含/等于/比较/区间）与顺序，在线预览、打包 zip 下载或直接写入项目根目录（默认不覆盖已有文件，可自动注册模块）。生成配置可按名字保存复用。
author: NexAdmin
edition: free
requires_nexadmin: ">=0.1.0"

# 安装时写入 sys_menu；title 是 i18n key，文案在 web/locales 的 plugin_codegen 命名空间里。
menus:
  - parent: /dev
    type: menu
    title: plugin_codegen.menu
    path: /system/codegen
    component: plugins/codegen/CodegenPage
    perm: codegen:list
    icon: Code
    sort: 30
    keep_alive: true
  - parent: codegen:list
    type: button
    title: plugin_codegen.btn.download
    perm: codegen:download
    sort: 10
  - parent: codegen:list
    type: button
    title: plugin_codegen.btn.install
    perm: codegen:install
    sort: 20
  - parent: codegen:list
    type: button
    title: plugin_codegen.btn.saveConfig
    perm: codegen:edit
    sort: 30
