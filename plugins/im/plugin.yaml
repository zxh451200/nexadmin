id: im
name: 在线客服
version: 0.6.0
description: 会话与消息：访客-坐席双向聊天（biz 三元组幂等挂业务对象）、结束闭环（系统消息 + 双通道推送）、访客已读、坐席认领、坐席在线心跳与自动分配/排队、满意度评价、快捷回复、标签、内部备注、消息撤回、会话合并、统计看板、访客来源、图片/文件附件、坐席转接、工作时间与离线提示、欢迎语、敏感词过滤、主动邀请、空闲自动关闭、已结束会话的保留期清理（超管可手动删除）、会话记录导出、im.message.created 事件；坐席端 WebSocket 优先 / SSE 兜底，访客端 SSE + 轮询兜底；推送经 cluster.Bus 跨实例广播。
author: NexAdmin
edition: pro
requires_nexadmin: ">=0.1.0"
menus:
  - parent: /
    type: menu
    title: plugin_im.menu
    path: /im/conversations
    component: plugins/im/ImPage
    perm: im:list
    icon: MessagesSquare
    sort: 61
    keep_alive: true
  - parent: im:list
    type: button
    title: plugin_im.perm.reply
    perm: im:reply
  - parent: im:list
    type: button
    title: plugin_im.perm.edit
    perm: im:edit
